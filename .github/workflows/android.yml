name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and source-only debug build
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --stacktrace
      - name: Publish failure diagnostics
        if: failure()
        run: |
          set -euo pipefail
          {
            date
            echo '--- failed tests ---'
            find . -path '*/build/test-results/*' -name 'TEST-*.xml' -print0 | while IFS= read -r -d '' f; do
              python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          p = sys.argv[1]
          try:
              root = ET.parse(p).getroot()
          except Exception:
              sys.exit()
          for tc in root.iter('testcase'):
              for bad in list(tc):
                  if bad.tag in ('failure', 'error'):
                      print(f"{tc.get('classname')}#{tc.get('name')}: {bad.get('message', '')[:800]}")
          PY
            done
            echo '--- lint reports ---'
            for f in mobile/build/reports/lint-results-debug.txt home/build/reports/lint-results-debug.txt samples/maphost/build/reports/lint-results-debug.txt; do
              [ -f "$f" ] && { echo "== $f =="; sed -n '1,150p' "$f"; }
            done
            echo '--- compile errors from gradle scan (if any) ---'
          } > failure.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "ci/diagnostics-${{ github.run_id }}"
          git add failure.txt
          git commit -m "diagnostics ${{ github.run_id }}"
          git push origin "HEAD:ci/diagnostics-${{ github.run_id }}"
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            mobile/build/reports/lint-results-debug.html
            samples/home/build/reports/tests/
            samples/home/build/reports/lint-results-debug.html
            samples/maphost/build/reports/lint-results-debug.html
